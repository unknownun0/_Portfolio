<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel - Earl John A. Gomez</title>
    <meta name="description" content="Admin panel for the Earl John A. Gomez portfolio." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="antialiased">
    <header class="fixed top-0 left-0 right-0 z-50 backdrop-blur-md" style="background: color-mix(in srgb, var(--bg) 88%, transparent); border-bottom:1px solid var(--border);">
      <div class="mx-auto flex h-16 max-w-6xl items-center justify-between px-6 md:px-10">
        <a href="index.html" class="font-mono text-xs tracking-widest" style="color:var(--fg-dim);">[ MY: EJAG-PORTFOLIO / ADMIN ]</a>
        <div class="flex items-center gap-3">
          <a href="index.html" class="glow-border font-mono text-xs px-3 py-1.5 inline-flex items-center" style="color:var(--fg-dim);">[ SITE ]</a>
          <button id="theme-toggle" aria-label="Toggle light and dark mode" class="glow-border font-mono text-xs px-3 py-1.5" style="color:var(--fg-dim);"><span id="theme-label">[ DARK ]</span></button>
        </div>
      </div>
    </header>

    <main class="min-h-screen grid place-items-center px-6 py-24">
      <div class="admin-panel glow-border ticks">
        <div class="flex items-center justify-between gap-4 mb-4">
          <div>
            <p class="font-mono text-[11px] tracking-widest" style="color:var(--fg-mute);">[ ADMIN PANEL ]</p>
            <h2 class="font-display text-2xl mt-1">Edit portfolio content</h2>
          </div>
        </div>
        <div id="admin-login">
          <label class="block font-mono text-xs mb-2" style="color:var(--fg-dim);">Password</label>
          <input id="admin-pass" class="admin-input" type="password" autocomplete="current-password" />
          <div class="mt-4 flex gap-3 flex-wrap">
            <button id="admin-login-btn" class="glow-border font-mono text-xs px-4 py-2" style="color:var(--fg-dim);">LOGIN</button>
            <button id="admin-reset-btn" class="glow-border font-mono text-xs px-4 py-2" style="color:var(--fg-dim);">RESET DATA</button>
          </div>
          <p class="font-mono text-[11px] mt-3" style="color:var(--fg-mute);">Client-side only. Password-protected.</p>
        </div>
        <div id="admin-editor" class="hidden">
          <label class="block font-mono text-xs mb-2" style="color:var(--fg-dim);">Portfolio JSON</label>
          <textarea id="admin-json" class="admin-input admin-textarea font-mono text-xs"></textarea>
          <div class="mt-4 flex flex-wrap gap-3">
            <button id="admin-save-btn" class="glow-border font-mono text-xs px-4 py-2" style="color:var(--fg-dim);">SAVE</button>
            <button id="admin-export-btn" class="glow-border font-mono text-xs px-4 py-2" style="color:var(--fg-dim);">EXPORT</button>
            <button id="admin-copy-btn" class="glow-border font-mono text-xs px-4 py-2" style="color:var(--fg-dim);">COPY JSON</button>
          </div>
          <p id="admin-status" class="font-mono text-[11px] mt-3" style="color:var(--fg-mute);"></p>
        </div>
      </div>
    </main>

    <script src="data.js"></script>
    <script src="admin.js" defer></script>
  </body>
</html>
